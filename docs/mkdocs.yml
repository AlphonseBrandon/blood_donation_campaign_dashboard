site_name: Blood Donation Campaign Dashboard
site_author: ABO Team
site_description: Documentation for Blood Donation Campaign Analytics Dashboard

repo_url: https://github.com/AlphonseBrandon/blood_donation_campaign_dashboard
site_url: https://AlphonseBrandon.github.io/blood_donation_campaign_dashboard/

# Directory configurations
docs_dir: docs  # Source directory containing markdown files
site_dir: ../site  # Output directory for built site

theme:
  name: mkdocs  # Changed to material theme for better features
  palette:
    scheme: default
    primary: red
    accent: red
  features:
    - navigation.tabs
    - navigation.sections
    - search.highlight

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Technical Documentation:
    - Dashboard: dashboard.md
    - Features: features.md
    - Modeling: modeling.md
    - Eligibility: eligibilty.md
  - About: about.md

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [../blood_donation_campaign_dashboard/src]  # Updated path
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css