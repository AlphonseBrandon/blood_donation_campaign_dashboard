site_name: Blood Donation Campaign Dashboard
site_author: ABO Team
site_description: Documentation for Blood Donation Campaign Analytics Dashboard


repo_url: https://github.com/AlphonseBrandon/blood_donation_campaign_dashboard

# Theme configuration
theme:
  name: mkdocs
  palette:
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.highlight

# Extensions
markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - footnotes

# Plugins
plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # Update path to point to src directory
          paths: [../src]
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2
            show_category_heading: true
            show_if_no_docstring: true

# Navigation structure
nav:
  - Home: 'index.md'
  - Technical Documentation:
    - 'Dashboard': 'dashboard.md'
    - 'Features': 'features.md'
    - 'Modeling': 'modeling.md'
  - Literature Review:
    - 'Why this matters': 'Why this matters.md'
    - 'Eligibility': 'Eligibility.md'
    - 'User Personas': 'user_personas.md'
    - 'FAQs': 'faqs.md'
  - About: 'about.md'

# Extra CSS
extra_css:
  - stylesheets/extra.css